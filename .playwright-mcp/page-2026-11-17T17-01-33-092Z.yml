              - paragraph [ref=f10e1536]: No. North doesn’t resell cloud infrastructure. We integrate with your existing AWS, GCP, and Azure accounts to give you better visibility, control, and automation;without altering how you buy cloud.
            - generic [ref=f10e1543] [cursor=pointer]:
              - paragraph [ref=f10e1545]: Will North force me to replace my existing savings plans or reserved instances?
              - paragraph [ref=f10e1549]: No. North works alongside whatever commitment strategy you already have—EDPs, CUDs, Reserved Instances (RIs), Savings Plans (SPs). Flexbot uses North-owned commitments for teams that want flexibility and zero lock-in. Autobot automates customer-owned purchasing month-to-month. Most teams run both, or layer North's optimization on top of existing commitments. The choice is yours, with no switching required.
            - generic [ref=f10e1556] [cursor=pointer]:
              - paragraph [ref=f10e1558]: Why do I need an "operating system" for cloud costs?
              - paragraph [ref=f10e1562]: Cloud spend is no longer just infrastructure—it's your cloud, AI, and data platforms running together, often invisibly. Most teams stitch together five separate tools for allocation, reporting, optimization, forecasting, and commitment management. North brings the entire FinOps lifecycle into a single system so finance and engineering see one set of numbers they both trust, and optimization runs on autopilot instead of requiring projects.
            - generic [ref=f10e1569] [cursor=pointer]:
              - paragraph [ref=f10e1571]: How fast can we actually get to savings?
              - paragraph [ref=f10e1575]: "North connects in 5 minutes and analyzes your account for free—so you see specific savings opportunities before you commit. Most teams see meaningful savings within 30 days, with larger impact compounding over time as rightsizing, commitment optimization, and allocation-driven accountability kick in. Average customer savings: 35–50% across the cloud stack."
            - generic [ref=f10e1582] [cursor=pointer]:
              - paragraph [ref=f10e1584]: Do I have to commit for years to get these savings?
              - paragraph [ref=f10e1588]: "No. North offers month-to-month flexibility on our plans, with the exception of Premier Plus, which has a one-year contract. On commitments themselves, you have two options: Flexbot (North holds the contracts, zero lock-in for you, can retrieve in 7 days average) or Autobot (you own commitments, North automates month-to-month purchasing). Either way, you get the discounts without the risk. Run both if you want maximum flexibility."
            - generic [ref=f10e1595] [cursor=pointer]:
              - paragraph [ref=f10e1597]: Does this work if we're multi-cloud?
              - paragraph [ref=f10e1601]: Yes. AWS, GCP, and Azure all optimized side by side in one view—no switching tools or stitching exports. One set of numbers everyone trusts. If you use multiple clouds, they finally stop being separate billing headaches and become one unified optimization problem.
            - generic [ref=f10e1608] [cursor=pointer]:
              - paragraph [ref=f10e1610]: Is my data secure with North?
              - paragraph [ref=f10e1614]: Yes. SOC 2 Type II certified, least-privilege IAM roles, and compliance-first security at every layer. Your data stays protected without introducing third-party risk. North is built for the security demands of modern enterprise teams.
