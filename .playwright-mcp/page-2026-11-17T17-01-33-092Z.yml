                  - /url: /features/coststreams
            - generic [ref=f10e779]:
              - button "Analyze" [ref=f10e780] [cursor=pointer]
              - generic [ref=f10e784]:
                - paragraph [ref=f10e785]: Explore, compare, and forecast cloud spend. Slice spend any way you need, see exactly what changed between any two periods, and project where it's heading, all without exporting a thing.
                - link "Explore Analyze" [ref=f10e787] [cursor=pointer]:
                  - /url: /features/analyze
            - generic [ref=f10e799]:
              - button "Monitor" [ref=f10e800] [cursor=pointer]
              - generic [ref=f10e804]:
                - paragraph [ref=f10e805]: Catch cost anomalies before they hit the bill. Routine spikes are filtered out, so every alert that reaches you comes with the root cause, cost impact, and a path to act.
